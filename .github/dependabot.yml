version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - javascript
    groups:
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
    # TypeScript 7 is the native Go port: the npm package no longer ships
    # the JavaScript compiler API (there is no `typescript/lib/tsc`).
    # `vue-tsc` resolves the compiler through exactly that path, and it is
    # used for `build`/`typecheck` in 6 packages (dashboard, claim-ui,
    # nimiq-pow-ui, and three Vue examples), three of which are also built
    # inside the Docker image. vue-tsc's peer range is an open-ended
    # ">=5.0.0", so a TS 7 install resolves cleanly and only fails at build
    # time — see #294. No TS 7-capable vue-tsc exists yet (latest 3.3.9
    # still calls require.resolve('typescript/lib/tsc')). Drop this ignore
    # once vue-tsc ships TS 7 support; until then the weekly PR is pure noise.
    ignore:
      - dependency-name: "typescript"
        update-types: [ "version-update:semver-major" ]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - github-actions
    # github/codeql-action/* are four sub-actions of ONE action that must
    # always run at the same version: `init` writes a config file the
    # later steps read back, so a partial bump fails Analyze with
    # "Loaded a configuration file for version 'X', but running version 'Y'".
    # Dependabot treats each sub-path as its own dependency, so without a
    # group it opens one PR per sub-action and each is individually
    # un-mergeable (exactly what happened with #291 vs #292). Grouping
    # moves the SHA atomically. docker/* is grouped for the weaker reason
    # that those actions are always bumped together in practice.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
      docker-actions:
        patterns:
          - "docker/*"

  - package-ecosystem: docker
    directory: /deploy/docker
    schedule:
      interval: weekly
    labels:
      - dependencies
      - docker
    # Stay on Node 22 LTS. Major bumps need manual review — LTS branch
    # matters for production faucet operators; we opt in deliberately.
    ignore:
      - dependency-name: "node"
        update-types: [ "version-update:semver-major" ]
