name: Config reference drift

# Weekly check that `docs/config-reference.md` is in sync with
# `apps/server/src/config.ts`. If `config.ts` was edited without a
# corresponding regeneration, opens a PR with the freshly-regenerated
# doc so a maintainer can review the drift and merge.
#
# Per-PR drift is already caught by `pnpm pre-merge` in CI. This weekly
# job is the safety net for the case where a maintainer bypasses the
# pre-merge gate (admin merge, hotfix) or where the doc rendering
# itself changes (e.g., a bugfix in scripts/generate-config-reference.mts
# that wasn't accompanied by a regeneration).
#
# §2.3.8.

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  regenerate:
    name: Regenerate config-reference.md
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Activate pnpm via corepack
        run: |
          corepack enable
          corepack install -g pnpm@$(node -p "require('./package.json').packageManager.split('@')[1]")

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Regenerate config reference
        run: pnpm generate:config-reference

      - name: Create PR if drifted
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          base: main
          branch: chore/config-reference-drift
          commit-message: 'chore(docs): regenerate config-reference.md (§2.3.8 drift detection)'
          title: 'chore(docs): regenerate config-reference.md (§2.3.8 drift detection)'
          body: |
            Automated regeneration of `docs/config-reference.md` from the canonical
            Zod schema in `apps/server/src/config.ts`. If this PR exists, the doc
            was drifting from source — review the diff and merge if it looks
            sensible.

            Drift is also caught by `pnpm pre-merge` on every PR; this weekly
            cron is the safety net.
          add-paths: |
            docs/config-reference.md
          labels: |
            documentation
