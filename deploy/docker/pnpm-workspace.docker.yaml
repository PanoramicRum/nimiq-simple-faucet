# Docker-only pnpm workspace definition.
#
# This file is intentionally narrower than the root /pnpm-workspace.yaml:
# the Docker image only ships apps/server + claim-ui + dashboard and their
# direct dependencies. We omit examples/*, sdk-react/vue/capacitor/etc.
# here to keep the build context small and the deps stage fast.
#
# Keep this list in sync with the server's transitive deps — any new
# package an app imports must be added here AND have its package.json
# COPY'd in the Dockerfile's deps stage.
packages:
  - "apps/server"
  - "apps/claim-ui"
  - "apps/dashboard"
  - "apps/nimiq-pow-ui"
  - "packages/core"
  - "packages/driver-nimiq-rpc"
  - "packages/driver-nimiq-wasm"
  - "packages/abuse-fcaptcha"
  - "packages/abuse-hashcash"
  - "packages/abuse-hcaptcha"
  - "packages/abuse-geoip"
  - "packages/abuse-fingerprint"
  - "packages/abuse-onchain-nimiq"
  - "packages/abuse-ai"
  - "packages/sdk-ts"

# ---------------------------------------------------------------------------
# MIRROR of the pnpm settings in the root /pnpm-workspace.yaml — keep the
# three maps below byte-identical with the root file (rationale prose lives
# there). This file replaces the root one inside the image build, and the
# frozen-lockfile install in the deps stage fails on any override mismatch;
# a missing allowBuilds entry ships an image without the better-sqlite3
# binding.
# ---------------------------------------------------------------------------
overrides:
  "hono@<4.12.34": ">=4.12.34"
  "undici@<8.9.0": ">=8.9.0"
  "fast-uri@3": "~3.1.5"
  "fast-uri@4": "~4.1.2"
  "ip-address@<10.3.1": ">=10.3.1"
  "postcss@<8.5.23": ">=8.5.23"
  "happy-dom@<20.8.9": ">=20.8.9"
  "elliptic@<6.6.1": ">=6.6.1"
  "axios@<1.16.0": ">=1.16.0"
  "underscore@<1.13.8": ">=1.13.8"
  "bn.js@<4.12.3": ">=4.12.3"
  "brace-expansion@<5.0.9": ">=5.0.9"
  "ws@<8.20.1": ">=8.20.1"
  "qs@<=6.15.1": ">=6.15.2"
  "vite@>=8.0.0 <8.0.16": ">=8.0.16"
  "js-yaml@3": "~3.15.1"
  "js-yaml@4": "~4.3.1"
  "shell-quote@<1.8.5": ">=1.8.5"
  "sharp@<0.35.0": ">=0.35.0"
  "@hono/node-server@<2.0.5": ">=2.0.5"

auditConfig:
  ignoreGhsas:
    - GHSA-67mh-4wv8-2f99
    - GHSA-4w7w-66w2-5vf9
    - GHSA-w5hq-g745-h8pq
    - GHSA-fx2h-pf6j-xcff
    - GHSA-v6wh-96g9-6wx3

allowBuilds:
  better-sqlite3: true
  esbuild: true
  bufferutil: true
  utf-8-validate: true
  sharp: true
  es5-ext: false
