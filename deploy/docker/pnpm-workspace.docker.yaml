# Docker-only pnpm workspace definition.
#
# This file is intentionally narrower than the root /pnpm-workspace.yaml:
# the Docker image only ships apps/server + claim-ui + dashboard and their
# direct dependencies. We omit examples/*, sdk-react/vue/capacitor/etc.
# here to keep the build context small and the deps stage fast.
#
# Keep this list in sync with the server's transitive deps — any new
# package an app imports must be added here AND have its package.json
# COPY'd in the Dockerfile's deps stage.
packages:
  - "apps/server"
  - "apps/claim-ui"
  - "apps/dashboard"
  - "apps/nimiq-pow-ui"
  - "packages/core"
  - "packages/driver-nimiq-rpc"
  - "packages/driver-nimiq-wasm"
  - "packages/abuse-fcaptcha"
  - "packages/abuse-hashcash"
  - "packages/abuse-hcaptcha"
  - "packages/abuse-geoip"
  - "packages/abuse-fingerprint"
  - "packages/abuse-onchain-nimiq"
  - "packages/abuse-ai"
  - "packages/sdk-ts"

# ---------------------------------------------------------------------------
# MIRROR of the pnpm settings in the root /pnpm-workspace.yaml — keep the
# three maps below byte-identical with the root file (rationale prose lives
# there). This file replaces the root one inside the image build, and the
# frozen-lockfile install in the deps stage fails on any override mismatch;
# a missing allowBuilds entry ships an image without the better-sqlite3
# binding.
# ---------------------------------------------------------------------------
overrides:
  "hono@<4.12.25": ">=4.12.25"
  "undici@<8.5.0": ">=8.5.0"
  "fast-uri@<3.1.4": "~3.1.4"
  "ip-address@<10.1.1": ">=10.1.1"
  "postcss@<8.5.10": ">=8.5.10"
  "happy-dom@<20.8.9": ">=20.8.9"
  "elliptic@<6.6.1": ">=6.6.1"
  "axios@<1.16.0": ">=1.16.0"
  "underscore@<1.13.8": ">=1.13.8"
  "bn.js@<4.12.3": ">=4.12.3"
  "brace-expansion@<5.0.7": ">=5.0.7"
  "ws@<8.20.1": ">=8.20.1"
  "qs@<=6.15.1": ">=6.15.2"
  "vite@>=8.0.0 <8.0.16": ">=8.0.16"
  "js-yaml@3": "~3.15.0"
  "js-yaml@4": "~4.3.0"
  "shell-quote@<1.8.5": ">=1.8.5"
  "sharp@<0.35.0": ">=0.35.0"
  "@hono/node-server@<2.0.5": ">=2.0.5"

auditConfig:
  ignoreGhsas:
    - GHSA-67mh-4wv8-2f99
    - GHSA-4w7w-66w2-5vf9
    - GHSA-w5hq-g745-h8pq
    - GHSA-fx2h-pf6j-xcff
    - GHSA-v6wh-96g9-6wx3

allowBuilds:
  better-sqlite3: true
  esbuild: true
  bufferutil: true
  utf-8-validate: true
  sharp: true
  es5-ext: false

# Mirror of the root minimumReleaseAgeExclude block (same-day releases
# from the #279 dev group + the expo 57 coordinated bump); the lockfile
# embeds publish timestamps, so the frozen install in the deps stage
# rejects these without the exclusions. Ages out 2026-07-23.
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.10'
  - '@expo/config-plugins@57.0.6'
  - '@expo/config@57.0.6'
  - '@expo/fingerprint@0.20.6'
  - '@expo/image-utils@0.11.4'
  - '@expo/metro-config@57.0.7'
  - '@expo/prebuild-config@57.0.9'
  - '@expo/require-utils@57.0.4'
  - '@expo/router-server@57.0.4'
  - babel-preset-expo@57.0.4
  - expo-asset@57.0.7
  - expo-constants@57.0.7
  - expo-modules-autolinking@57.0.9
  - expo-modules-core@57.0.7
  - expo-modules-jsi@57.0.4
  - expo@57.0.8
  - '@expo/metro-runtime@57.0.7'
  - vue-tsc@3.3.8
  - '@vue/language-core@3.3.8'
  - turbo@2.10.6
  - '@turbo/darwin-64@2.10.6'
  - '@turbo/darwin-arm64@2.10.6'
  - '@turbo/linux-64@2.10.6'
  - '@turbo/linux-arm64@2.10.6'
  - '@turbo/windows-64@2.10.6'
  - '@turbo/windows-arm64@2.10.6'
  - happy-dom@20.11.1
  - postcss@8.5.22
  - '@vitejs/plugin-react@6.0.4'
